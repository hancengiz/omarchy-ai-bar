name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust, policy, and parity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out omarchy-ai-bar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned CodexBar baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: steipete/CodexBar
          ref: 1680b4ed5bca69f167d388ed17a5b2c36dd05d1f
          path: .baseline/CodexBar
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check every Rust target
        run: cargo check --workspace --all-targets --locked

      - name: Test every Rust target
        run: cargo test --workspace --all-targets --locked

      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Deny rustdoc warnings
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Prove dependency-family gate behavior
        run: scripts/verify-dependency-families.sh --self-test

      - name: Enforce dependency families
        run: scripts/verify-dependency-families.sh

      - name: Validate source-package and release layout
        run: scripts/verify-package.sh --layout-only

      - name: Prove secret-canary gate behavior
        run: scripts/scan-secret-canaries.sh --self-test

      - name: Validate provider and feature parity ledgers
        run: scripts/verify-parity-ledger.sh
        env:
          OAB_BASELINE_DIR: ${{ github.workspace }}/.baseline/CodexBar

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  qml:
    name: QML lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out omarchy-ai-bar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt QML lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes qml6-module-qttest qt6-declarative-dev-tools

      - name: Parse every QML source
        run: |
          while IFS= read -r -d '' source; do
            /usr/lib/qt6/bin/qmlformat "$source" >/dev/null
          done < <(find qml tests -type f -name '*.qml' -print0 | sort -z)

      - name: Lint the dependency-free protocol surface
        run: /usr/lib/qt6/bin/qmllint qml/omarchy-plugin/Protocol.js

  release-binary:
    name: Release binary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out omarchy-ai-bar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0

      - name: Build the release executable
        run: cargo build --workspace --release --locked

      - name: Assert one project binary and one top-level ELF
        run: |
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          test "$(jq '[.packages[].targets[] | select(.kind | index("bin"))] | length' <<<"$metadata")" -eq 1
          test "$(jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name' <<<"$metadata")" = omarchy-ai-bar
          mapfile -d '' executables < <(find target/release -maxdepth 1 -type f -executable -print0)
          test "${#executables[@]}" -eq 1
          test "${executables[0]}" = target/release/omarchy-ai-bar
          file --brief "${executables[0]}" | grep --quiet '^ELF '

      - name: Scan the release executable for secret canaries
        run: |
          scripts/scan-secret-canaries.sh --self-test
          scripts/scan-secret-canaries.sh

      - name: Upload the verified executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omarchy-ai-bar-linux-x86_64
          path: target/release/omarchy-ai-bar
          if-no-files-found: error
          retention-days: 7
