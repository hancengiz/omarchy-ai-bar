[workspace]
members = [
    "crates/app",
    "crates/auth",
    "crates/cli",
    "crates/cost",
    "crates/domain",
    "crates/ipc",
    "crates/plugins",
    "crates/providers",
    "crates/runtime",
    "crates/sessions",
    "crates/storage",
    "crates/test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
clap = { version = "~4.5", features = ["derive"] }
getrandom = { version = "~0.2.17", features = ["std"] }
hmac = "~0.12.1"
nix = { version = "~0.31.3", default-features = false, features = ["fs", "process", "resource", "signal", "socket", "user"] }
rust_decimal = { version = "~1.42.1", default-features = false, features = ["std"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.151"
sha2 = "~0.10.9"
thiserror = "~2.0.20"
time = { version = "~0.3.55", default-features = false, features = ["std", "serde-well-known"] }
zeroize = "~1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
