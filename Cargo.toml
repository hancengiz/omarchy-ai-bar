[workspace]
members = [
    "crates/app",
    "crates/auth",
    "crates/cli",
    "crates/cost",
    "crates/domain",
    "crates/ipc",
    "crates/plugins",
    "crates/providers",
    "crates/runtime",
    "crates/sessions",
    "crates/storage",
    "crates/test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
clap = { version = "~4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
