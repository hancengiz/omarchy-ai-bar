[workspace]
members = [
    "crates/app",
    "crates/auth",
    "crates/cli",
    "crates/cost",
    "crates/domain",
    "crates/ipc",
    "crates/plugins",
    "crates/providers",
    "crates/runtime",
    "crates/sessions",
    "crates/storage",
    "crates/test-support",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
aes = "~0.8.4"
base64 = "~0.22.1"
cbc = "~0.1.2"
clap = { version = "~4.5", features = ["derive"] }
clap_complete = "~4.5"
futures-util = "~0.3.34"
getrandom = { version = "~0.2.17", features = ["std"] }
hmac = "~0.12.1"
httpdate = "~1.0.3"
ksni = { version = "~0.3.3", default-features = false, features = ["tokio"] }
nix = { version = "~0.31.3", default-features = false, features = ["fs", "process", "resource", "signal", "socket", "term", "user"] }
notify-rust = { version = "~4.18.0", default-features = false, features = ["z-with-tokio"] }
oo7 = { version = "~0.6.0", default-features = false, features = ["native_crypto", "tokio"] }
pbkdf2 = "~0.13.0"
rusqlite = { version = "~0.40.2", default-features = false }
reqwest = { version = "~0.13.4", default-features = false, features = ["rustls", "stream"] }
rquickjs = { version = "~0.12.2", default-features = false }
rust_decimal = { version = "~1.42.1", default-features = false, features = ["std"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.151"
sha1 = "~0.10.6"
sha2 = "~0.10.9"
tempfile = "~3.27.0"
thiserror = "~2.0.20"
time = { version = "~0.3.55", default-features = false, features = ["std", "serde-well-known", "local-offset"] }
tokio = { version = "~1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "~0.7.19", default-features = false, features = ["rt"] }
unicode-normalization = "~0.1.25"
url = "~2.5.8"
zeroize = { version = "~1.9.0", features = ["serde"] }
zbus = { version = "~5.19.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
